<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Topic Masterclass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-3">
                    <a href="../../" class="text-xs font-semibold text-slate-500 hover:text-amber-700">← DsaVault</a>
                    <span class="bg-amber-100 text-amber-800 font-bold px-2.5 py-1 rounded text-sm tracking-wide border border-amber-300">NEW</span>
                    <h1 class="text-xl font-bold text-slate-900 tracking-tight">Topic title</h1>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-10">
        <section class="bg-gradient-to-br from-slate-900 to-slate-800 text-white rounded-2xl p-6 sm:p-8 shadow-xl">
            <p class="text-xs font-semibold text-amber-400 mb-3">Replace this template with your note</p>
            <h2 class="text-2xl sm:text-4xl font-extrabold tracking-tight">One-line promise of the lecture</h2>
            <p class="text-slate-300 mt-4 max-w-3xl">Short summary. Then add visualizers, catalogs, and a quiz like the other masterclasses.</p>
        </section>

        <section class="bg-white rounded-2xl p-6 sm:p-8 border border-slate-200 shadow-sm space-y-3">
            <h3 class="text-xl font-bold text-slate-900">1. First section</h3>
            <p class="text-slate-600 text-sm leading-relaxed">Paste notes, diagrams, or interactive widgets here.</p>
        </section>
    </main>

    <footer class="border-t border-slate-200 bg-white py-6 text-center text-xs text-slate-500">
        <a href="../../" class="text-amber-700 font-semibold hover:underline">Back to DsaVault</a>
    </footer>
</body>
</html>
